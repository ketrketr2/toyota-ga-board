<style>
:root{--bg:#0A1120;--card:#0E1729;--line:#1D2A44;--cy:#38BDF8;--te:#00E5C7;--tx:#EAF3FC;--tx2:#9FB2CC;--mut:#5D7292;--rd:#FF5D5D}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'BIZ UDPGothic',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
background-image:linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px);background-size:44px 44px}
.card{width:min(420px,92vw);background:linear-gradient(180deg,#101B31,#0C1526);border:1px solid var(--line);border-radius:18px;padding:38px 36px 32px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo .t{width:38px;height:38px;border-radius:10px;background:var(--te);color:#041220;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:20px}
.logo b{font-size:17px;letter-spacing:.08em}
.sub{color:var(--mut);font-size:11.5px;letter-spacing:.14em;margin-bottom:26px;font-family:'JetBrains Mono',monospace}
label{display:block;font-size:11px;color:var(--tx2);letter-spacing:.12em;margin:14px 0 6px}
input{width:100%;background:#0A1322;border:1px solid var(--line);border-radius:9px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:14px;padding:11px 13px;outline:none;transition:border .15s}
input:focus{border-color:var(--cy)}
button{width:100%;margin-top:22px;background:linear-gradient(90deg,#0891B2,#0EA5A0);border:none;border-radius:9px;color:#fff;font-family:'BIZ UDPGothic',sans-serif;font-weight:700;font-size:14px;letter-spacing:.2em;padding:12px;cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.55;cursor:wait}
.err{color:var(--rd);font-size:12px;margin-top:12px;min-height:16px;text-align:center}
.note{color:var(--mut);font-size:10.5px;margin-top:18px;text-align:center;line-height:1.7}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo"><div class="t">T</div><b>TOYOTA GA4 COMMAND</b></div>
  <div class="sub">RESTRICTED · AES-256 ENCRYPTED</div>
  <form id="f">
    <label>ID</label><input id="u" autocomplete="username" autocapitalize="none" autofocus>
    <label>PASSWORD</label><input id="p" type="password" autocomplete="current-password">
    <button id="b" type="submit">UNLOCK</button>
  </form>
  <div class="err" id="e"></div>
  <div class="note">本ボードは暗号化されています。閲覧権限のある関係者のみアクセスしてください。<br>ページ本体・データは正しい ID / PASSWORD なしには復号できません。</div>
</div>

/* ---- 利用ログ（端末ローカル・localStorage）。ボード側の「利用ログ」ページが読む ---- */
const ULOGK='tgcULog_v1';
function ulogAdd(ev){try{const a=JSON.parse(localStorage.getItem(ULOGK)||'[]');a.push(Object.assign({},ev,{ts:Date.now()}));if(a.length>3000)a.splice(0,a.length-3000);localStorage.setItem(ULOGK,JSON.stringify(a));}catch(_){}}
function ulogPatchLast(t,f){try{const a=JSON.parse(localStorage.getItem(ULOGK)||'[]');for(let i=a.length-1;i>=0;i--){if(a[i].t===t){Object.assign(a[i],f);break}}localStorage.setItem(ULOGK,JSON.stringify(a));}catch(_){}}
function devName(){const u=navigator.userAgent;const os=/Macintosh/.test(u)?'Mac':/Windows/.test(u)?'Windows':/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':'その他';const br=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'';return os+(br?'・'+br:'')}
function fetchIP(t){try{fetch('https://api.ipify.org?format=json',{signal:AbortSignal.timeout(4000)}).then(r=>r.json()).then(j=>ulogPatchLast(t,{ip:j.ip})).catch(_=>{});}catch(_){}}
async function derive(u,p){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlockWith(key,mode,uid){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:IV},key,CT);           // 失敗なら throw
  if(mode==='login'){ulogAdd({t:'login', id:uid, dev:devName()}); fetchIP('login');}
  if(mode==='resume'){ulogAdd({t:'resume', dev:devName()}); fetchIP('resume');}
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Response(pt).body.pipeThrough(ds)).text();
  try{ sessionStorage.setItem('tgc_k', JSON.stringify(await crypto.subtle.exportKey('jwk',key))); }catch(_){}
  document.open(); document.write(html); document.close();
}
(async()=>{ // 同一タブ内の再訪はスキップ
  try{
    const j=sessionStorage.getItem('tgc_k'); if(!j) return;
    const key=await crypto.subtle.importKey('jwk',JSON.parse(j),{name:'AES-GCM'},true,['decrypt']);
    await unlockWith(key,'resume');
  }catch(_){ try{sessionStorage.removeItem('tgc_k')}catch(__){} }
})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'), e=document.getElementById('e'), card=document.getElementById('card');
  b.disabled=true; b.textContent='DECRYPTING…'; e.textContent='';
  try{
    const uid=document.getElementById('u').value.trim();
    const key=await derive(uid, document.getElementById('p').value);
    await unlockWith(key,'login',uid);   // 復号成功時のみログ記録
  }catch(err){
    b.disabled=false; b.textContent='UNLOCK';
    e.textContent='ID または PASSWORD が正しくありません';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
});
